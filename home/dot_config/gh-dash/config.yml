# gh-dash's settings. gh-dash is a dashboard in the terminal for your GitHub pull
# requests (PRs), issues and notifications: run `gh dash` (after gh auth login).
#
# Most of this file is gh-dash's default configuration, written out in full. The
# changes are the last two PR sections, the g key, repoPaths, the Catppuccin
# colors under theme, and delta as the diff pager. Every setting is described at
# https://www.gh-dash.dev/configuration/.

# Each section is a tab showing the results of a GitHub search. The filters use
# the same syntax as GitHub's search bar: is:open (still open), author:@me
# (written by you), -author:@me (not written by you), and so on.
prSections:
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
    # Approved, non-draft PRs with successful checks; other merge requirements may remain.
    - title: Approved & green
      filters: is:open author:@me review:approved status:success draft:false
    - title: Changes requested
      filters: is:open author:@me review:changes_requested
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
# Notification tabs, filtered by why GitHub notified you (reason:...).
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
# How often, in seconds, gh-dash refreshes the branches and PRs in its view of a
# repository.
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
# Settings for every section: the preview pane (on the right, 45% of the width,
# or below the list when the terminal is narrow), 20 items per section, "LGTM"
# as the starting text when you approve a PR, the PR view first, and which
# columns to show and how wide. PRs and issues are fetched again every 30 minutes.
defaults:
    preview:
        open: true
        width: 0.45
        height: 0.6
        position: auto
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            labels:
                width: 22
                hidden: true
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
# Keys of your own. In any view, g opens lazygit in the selected item's local
# copy of the repository (found through repoPaths below). {{.RepoPath}} is filled
# in by gh-dash; `command cd` uses the shell's own cd, even where zoxide has
# replaced cd.
keybindings:
    universal:
        - key: g  # the maintainer's binding; Home still jumps to the top
          name: lazygit
          command: >
            command cd {{.RepoPath}} && lazygit
# Where your local copies (clones) of GitHub repositories are: * matches any
# repository name, so seven7thirty3five5/dotfiles would be ~/Projects/dotfiles.
repoPaths:
    seven7thirty3five5/*: ~/Projects/*  # local clones, for checkout and {{.RepoPath}}
theme:
    # Catppuccin Mocha, blue accent (from catppuccin/gh-dash).
    colors:
        text:
            primary: "#cdd6f4"
            secondary: "#89b4fa"
            inverted: "#11111b"
            faint: "#bac2de"
            warning: "#f9e2af"
            success: "#a6e3a1"
            error: "#f38ba8"
        background:
            selected: "#313244"
        border:
            primary: "#89b4fa"
            secondary: "#45475a"
            faint: "#313244"
    # Show how many items each tab has, and lines between table rows.
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
pager:
    diff: delta  # renders with your git [delta] settings (Catppuccin, line numbers)
# q quits without asking; authors get icons; when started inside a repository's
# folder, gh-dash first shows only that repository's items; and notifications you
# have already read are listed too.
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
