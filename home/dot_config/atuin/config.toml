# atuin's settings. atuin keeps your shell history in a searchable database and
# opens it with Ctrl-R. Settings not listed here keep atuin's defaults;
# `atuin default-config` prints every setting with its explanation.

update_check = false  # Homebrew upgrades atuin; skip the hourly check of api.atuin.sh
workspaces = true  # adds a repo-wide filter to the Ctrl-R mode cycle
enter_accept = false  # review or edit the chosen command before running it

[theme]
name = "catppuccin-mocha-blue"  # from themes/, downloaded via .chezmoiexternal.toml

[ui]
# Show exit status and working directory alongside each historical command.
columns = ["exit", "duration", "time", "directory", "command"]
