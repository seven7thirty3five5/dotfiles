# Starship's settings. Starship draws the prompt, the line before your cursor
# with the folder, git branch and so on. STARSHIP_CONFIG in ~/.config/zsh/.zshenv
# points it to this file. Settings not listed here keep Starship's defaults
# (https://starship.rs/config/).
#
# Built-in Starship prompt, recolored with the Catppuccin Mocha palette.
palette = "catppuccin_mocha"
# A palette gives names to colors. Starship's parts ("modules") color themselves
# by name, and a name defined here, such as red, means Catppuccin's version.

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
cyan = "#89dceb"    # = sky; Starship's directory module asks for "cyan"
purple = "#cba6f7"  # = mauve; its git_branch module asks for "purple"

# Show how many commits the branch is ahead/behind its upstream (starship docs example).
# ⇡ commits to push, ⇣ commits to pull, ⇕ both; ${count} is replaced by the number.
[git_status]
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'

# Show failed commands' exit codes; successful commands add no status segment.
[status]
disabled = false
symbol = "✘"
