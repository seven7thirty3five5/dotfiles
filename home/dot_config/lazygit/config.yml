# ~/.config/lazygit/config.yml
# lazygit's settings. lazygit is a terminal interface for git. Settings not
# listed here keep lazygit's defaults; `lazygit --config` prints all of them.

# Homebrew manages upgrades; disable LazyGit's own update prompts.
update:
  method: never

git:
  # How lazygit shows diffs; press | to switch between these. First delta, which
  # restyles git's colored diff (--paging=never: lazygit does the scrolling).
  # Then difftastic, which replaces git's diff altogether (extDiff), showing as
  # many lines around each change as lazygit's setting ({{diffContext}}, which
  # the { and } keys change).
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
    - type: extDiff  # press | in lazygit to cycle to difftastic
      command: difft --color=always --context={{diffContext}}

# Catppuccin Mocha (blue accent); diffs inherit delta's syntax-theme.
gui:
  nerdFontsVersion: "3"  # file icons; Ghostty bundles the Nerd Font symbols

  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"

  authorColors:
    "*": "#b4befe"  # every commit author's name in Catppuccin Lavender
