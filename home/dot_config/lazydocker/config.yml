# lazydocker's settings. lazydocker (lzd) is a terminal interface for Docker. It
# finds this file because .zshrc runs it with CONFIG_DIR set to this folder.

# Catppuccin Mocha (blue accent), reusing lazygit's official Catppuccin colors:
# there is no lazydocker port, but lazydocker takes the same theme keys and hex values.
gui:
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    selectedLineBgColor:
      - "#313244"
    optionsTextColor:
      - "#89b4fa"

# Include timestamps so events can be correlated across container logs.
logs:
  timestamps: true
