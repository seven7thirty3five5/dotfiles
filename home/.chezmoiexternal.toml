# Files chezmoi downloads instead of keeping copies here, each to the path in
# its brackets: the official Catppuccin Mocha theme ("port") for each app, with
# the blue accent where a port offers one, to match lazygit. chezmoi downloads
# each again after a week (refreshPeriod), or now with
# `chezmoi apply --refresh-externals`.

# btop's theme. btop.conf selects it with color_theme = "catppuccin_mocha".
[".config/btop/themes/catppuccin_mocha.theme"]
    type = "file"
    url = "https://raw.githubusercontent.com/catppuccin/btop/main/themes/catppuccin_mocha.theme"
    refreshPeriod = "168h"

# atuin's theme. atuin's config.toml selects it under [theme].
[".config/atuin/themes/catppuccin-mocha-blue.toml"]
    type = "file"
    url = "https://raw.githubusercontent.com/catppuccin/atuin/main/themes/mocha/catppuccin-mocha-blue.toml"
    refreshPeriod = "168h"

# eza's theme. eza reads theme.yml from its config folder by itself.
[".config/eza/theme.yml"]
    type = "file"
    url = "https://raw.githubusercontent.com/catppuccin/eza/main/themes/mocha/catppuccin-mocha-blue.yml"
    refreshPeriod = "168h"

# glow's style for Markdown. glow.yml points to it.
[".config/glow/catppuccin-mocha.json"]
    type = "file"
    url = "https://raw.githubusercontent.com/catppuccin/glamour/main/themes/catppuccin-mocha.json"
    refreshPeriod = "168h"

# delta's theme. The git config includes this file and turns the theme on with
# features = catppuccin-mocha.
[".config/delta/themes/catppuccin.gitconfig"]
    type = "file"
    url = "https://raw.githubusercontent.com/catppuccin/delta/main/catppuccin.gitconfig"
    refreshPeriod = "168h"

# yazi's theme, in the folder layout yazi expects for a flavor. theme.toml
# selects it with dark = "catppuccin-mocha". flavor.toml holds yazi's colors
# and tmtheme.xml colors the code shown in file previews.
[".config/yazi/flavors/catppuccin-mocha.yazi/flavor.toml"]
    type = "file"
    url = "https://raw.githubusercontent.com/yazi-rs/flavors/main/catppuccin-mocha.yazi/flavor.toml"
    refreshPeriod = "168h"

[".config/yazi/flavors/catppuccin-mocha.yazi/tmtheme.xml"]
    type = "file"
    url = "https://raw.githubusercontent.com/yazi-rs/flavors/main/catppuccin-mocha.yazi/tmtheme.xml"
    refreshPeriod = "168h"

# Fresh's theme, from the Catppuccin package in Fresh's own theme collection
# (Fresh's package manager would install the same file). config.json selects
# it with theme = "catppuccin-mocha".
[".config/fresh/themes/catppuccin-mocha.json"]
    type = "file"
    url = "https://raw.githubusercontent.com/sinelaw/fresh-plugins/main/themes/catppuccin/mocha.json"
    refreshPeriod = "168h"

# Micro's theme. settings.json selects it with colorscheme = "catppuccin-mocha".
[".config/micro/colorschemes/catppuccin-mocha.micro"]
    type = "file"
    url = "https://raw.githubusercontent.com/catppuccin/micro/main/themes/catppuccin-mocha.micro"
    refreshPeriod = "168h"
