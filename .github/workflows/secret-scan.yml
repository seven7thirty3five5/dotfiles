# Secret scan: look through the repository for things that look like passwords,
# API keys or tokens, so none get published by accident.
#
# Why this exists: the repository is public. chezmoi already refuses to `chezmoi add`
# a file that contains a secret (add.secrets = "error" in home/.chezmoi.toml.tmpl),
# but that only covers `chezmoi add`. Files edited directly and committed with git
# skip that check, so this workflow scans every commit that reaches GitHub.

# The name shown in the repository's Actions tab.
name: Secret scan

# When it runs: on every push, on pull requests, and on demand ("workflow_dispatch"
# adds a "Run workflow" button in the Actions tab).
on:
  push:
  pull_request:
  workflow_dispatch:

# What the automatic GitHub token may do in this workflow: only read the repository.
# Granting the least access needed limits the damage if a step were ever compromised.
permissions:
  contents: read

jobs:
  gitleaks:
    # A fresh Ubuntu virtual machine that GitHub provides for each run.
    runs-on: ubuntu-latest
    # Stop the job if it hangs; a scan normally takes seconds.
    timeout-minutes: 10
    steps:
      # Download the repository into the virtual machine.
      - uses: actions/checkout@v7
        with:
          # Download the whole history, not just the latest commit, so a secret
          # committed and then deleted later is still found (it stays in history).
          fetch-depth: 0
          # Don't leave GitHub's token in the downloaded repository's settings,
          # where later steps could read it; nothing here needs to push.
          persist-credentials: false

      # gitleaks is a widely used secret scanner; this is its official GitHub Action.
      # It is free for personal accounts (organizations need a license key).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action normally comments on pull requests, which needs a token that
          # can write. This workflow's token is read-only (see permissions above),
          # so results go to the job's summary page instead.
          GITLEAKS_ENABLE_COMMENTS: false
